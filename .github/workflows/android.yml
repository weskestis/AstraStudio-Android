name: Android Phase 10
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Install pinned SDK tools
        run: sdkmanager 'platforms;android-34' 'build-tools;35.0.0' 'ndk;28.0.13004108' 'cmake;3.22.1'
      - name: Verify source manifest
        run: sha256sum -c SOURCE_MANIFEST.sha256
      - name: Verify generated patch schema
        run: |
          python3 tools/generate_synth_schema.py
          git diff --exit-code -- app/src/main/cpp/dsp/ParameterIds.h app/src/main/java/com/weskestis/astrastudio/synth/SynthSchema.kt
      - name: Verify generated effects schema
        run: |
          python3 tools/generate_fx_schema.py
          git diff --exit-code -- app/src/main/cpp/fx/FxIds.h app/src/main/java/com/weskestis/astrastudio/fx/FxSchema.kt
      - name: Native core regression tests
        run: bash scripts/test-native.sh
      - name: Native memory and undefined-behavior checks
        run: |
          cmake -S app/src/main/cpp -B build/sanitized -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer' -DCMAKE_EXE_LINKER_FLAGS='-fsanitize=address,undefined'
          cmake --build build/sanitized --parallel 2
          ASAN_OPTIONS=detect_leaks=0 ctest --test-dir build/sanitized --output-on-failure
      - name: Render factory preset audition
        run: build/host/astra_render_presets build/Phase2-preset-audition.wav
      - name: Build, test and lint
        run: bash gradlew --no-daemon :app:assembleDebug :app:testDebugUnitTest :app:lintDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AstraStudio-Phase10-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Phase10-test-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
            build/host/Testing/Temporary/LastTest.log
            build/sanitized/Testing/Temporary/LastTest.log
            build/Phase2-preset-audition.wav

  interface:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Install pinned native tools
        run: sdkmanager 'platforms;android-34' 'build-tools;35.0.0' 'ndk;28.0.13004108' 'cmake;3.22.1'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 14 phone UI and file round trips
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash scripts/test-interface.sh
      - name: Upload interface reports and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Phase10-interface-validation
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            build/screenshots/
            build/ui-logcat.txt
